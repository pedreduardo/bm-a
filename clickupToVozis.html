<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ClickUp para Vozis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#07090F;--surface:#0D1117;--surfaceAlt:#111827;
    --border:#1C2333;--accent:#D4A853;
    --text:#E2D9CC;--muted:#6B7A94;--faint:#3A4558;
    --success:#4ADE80;--successDim:rgba(74,222,128,0.10);
    --danger:#F87171;--dangerDim:rgba(248,113,113,0.10);
  }
  body{background:var(--bg);color:var(--text);font-family:monospace;padding:36px 20px;min-height:100vh}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  h1{font-size:20px;font-weight:500}
  button{cursor:pointer;font-family:monospace}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .fade{animation:fadeIn .3s ease}
  .spinner{width:44px;height:44px;border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}
  .section-wrap{margin-bottom:22px}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .section-label{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.1em}
  .section-hr{flex:1;height:1px;background:var(--border)}
  .section-title{font-size:11px;color:var(--muted)}
  .section-body{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
  .stat-card{flex:1;min-width:90px;padding:12px 14px;background:var(--surface);border-radius:10px;border:1px solid var(--border)}
  .stat-val{font-size:24px;font-weight:800;line-height:1}
  .stat-label{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.1em}
  .stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .btn-primary{padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:700;letter-spacing:.04em;width:100%;background:linear-gradient(135deg,var(--accent),#C49A3C);color:var(--bg)}
  .btn-success{padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:700;background:linear-gradient(135deg,var(--success),#36B86A);color:var(--bg);width:100%}
  .tier-btn{padding:8px 20px;border:none;border-radius:6px;font-weight:700;font-size:13px;font-family:monospace;background:var(--surfaceAlt);color:var(--muted)}
  .tier-btn.active{background:var(--accent);color:var(--bg);box-shadow:0 0 16px rgba(212,168,83,.27)}
  .progress-track{height:3px;background:var(--border);border-radius:4px;max-width:320px;margin:0 auto}
  .progress-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
  .error-box{padding:10px 14px;background:var(--dangerDim);border:1px solid rgba(248,113,113,.2);border-radius:8px;font-size:12px;color:var(--danger);margin-bottom:16px}
  #app{max-width:820px;margin:0 auto}
  .hidden{display:none}
  .badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;background:var(--surfaceAlt);color:var(--accent);border:1px solid var(--border)}
</style>
</head>
<body>
<div id="app">
  <div style="margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:18px">
    <div style="font-size:10px;color:var(--accent);letter-spacing:.25em;text-transform:uppercase;margin-bottom:6px">BM&A · Recuperação de Crédito</div>
    <h1>ClickUp para Vozis</h1>
    <p style="font-size:11px;color:var(--muted);margin-top:4px">Exporta devedores únicos do ClickUp para XLSX de discagem</p>
  </div>

  <div id="error-box" class="error-box hidden"></div>

  <!-- SETUP -->
  <div id="step-setup" class="fade">
    <div class="section-wrap">
      <div class="section-head"><span class="section-label">01</span><div class="section-hr"></div><span class="section-title">Tier</span><div style="width:16px;height:1px;background:var(--border)"></div></div>
      <div class="section-body">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="tier-btn" onclick="selectTier('AB',this)">AB</button>
          <button class="tier-btn" onclick="selectTier('C',this)">C</button>
          <button class="tier-btn" onclick="selectTier('D',this)">D</button>
          <button class="tier-btn" onclick="selectTier('TODOS',this)">TODOS</button>
        </div>
      </div>
    </div>
    <button class="btn-primary hidden" id="btn-fetch" onclick="runFetch()">Buscar devedores no ClickUp</button>
  </div>

  <!-- FETCHING -->
  <div id="step-fetching" class="hidden" style="text-align:center;padding:40px 0">
    <div class="spinner"></div>
    <div id="progress-label" style="font-size:13px;color:var(--text);margin-bottom:8px"></div>
    <div id="progress-sub" style="font-size:10px;color:var(--muted);margin-bottom:12px"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>

  <!-- PREVIEW -->
  <div id="step-preview" class="hidden fade">
    <div class="section-wrap">
      <div class="section-head"><span class="section-label">02</span><div class="section-hr"></div><span class="section-title">Devedores únicos</span><div style="width:16px;height:1px;background:var(--border)"></div></div>
      <div class="section-body">
        <div class="stats-row" id="preview-stats"></div>
        <div style="overflow-x:auto;border-radius:8px;border:1px solid var(--border);margin-bottom:16px;max-height:420px;overflow-y:auto">
          <table>
            <thead>
              <tr style="background:var(--surfaceAlt);position:sticky;top:0">
                <th style="font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--border)">#</th>
                <th style="font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--border)">nome_contato</th>
                <th style="font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--border)">primeiro_nome</th>
                <th style="font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--border)">telefone</th>
                <th style="font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--border)">qtde_parcelas</th>
              </tr>
            </thead>
            <tbody id="preview-tbody"></tbody>
          </table>
        </div>
        <button class="btn-success" onclick="exportXLSX()">⬇ Exportar XLSX</button>
      </div>
    </div>
    <button onclick="reset()" style="margin-top:10px;width:100%;padding:12px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;font-size:12px">Nova busca</button>
  </div>
</div>

<script>
const TOKEN = "pk_60977371_UNE7JWRJS39YHBY0QYMQWXBSYUZSVWR3";
const LISTS = { AB:"901326680340", C:"901326680111", D:"901326670793" };

let TIER = "", EXPORT_ROWS = [];

function show(id){document.getElementById(id).classList.remove("hidden");}
function hide(id){document.getElementById(id).classList.add("hidden");}
function showError(msg){const el=document.getElementById("error-box");el.textContent="⚠ "+msg;el.classList.remove("hidden");}
function clearError(){document.getElementById("error-box").classList.add("hidden");}
function setProgress(pct, label, sub){
  if(pct!==null) document.getElementById("progress-fill").style.width=pct+"%";
  document.getElementById("progress-label").textContent=label;
  document.getElementById("progress-sub").textContent=sub||"";
}

function primeiroNome(nome){
  return String(nome||"").trim().split(/\s+/)[0] || "";
}

async function ckFetch(path){
  const r=await fetch("https://api.clickup.com/api/v2"+path,{
    headers:{Authorization:TOKEN,"Content-Type":"application/json"}
  });
  if(!r.ok) throw new Error(`ClickUp ${r.status}: ${await r.text()}`);
  return r.json();
}

async function fetchAllTasks(listId, label){
  const all=[]; let page=0;
  while(true){
    setProgress(null, `Buscando lista ${label}... (${all.length} tasks)`, `página ${page+1}`);
    const data=await ckFetch(`/list/${listId}/task?page=${page}&include_closed=true&subtasks=false&order_by=created`);
    const tasks=data.tasks||[];
    if(!tasks.length) break;
    all.push(...tasks);
    if(data.last_page===true||tasks.length<100) break;
    page++;
  }
  return all;
}

function selectTier(t, btn){
  TIER=t;
  document.querySelectorAll(".tier-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  show("btn-fetch");
}

async function runFetch(){
  clearError(); hide("step-setup"); show("step-fetching");
  try{
    const tiersToFetch = TIER==="TODOS" ? ["AB","C","D"] : [TIER];
    const allTasks = [];
    for(let i=0; i<tiersToFetch.length; i++){
      const t=tiersToFetch[i];
      setProgress(5+(i/tiersToFetch.length)*85, `Buscando lista ${t}...`, "");
      const tasks=await fetchAllTasks(LISTS[t], t);
      allTasks.push(...tasks);
    }

    setProgress(95, "Consolidando devedores únicos...", "");

    // Conta parcelas por devedor (nome normalizado como chave, mas guarda nome original)
    const map = {};
    for(const task of allTasks){
      const nome = String(task.name||"").trim();
      if(!nome) continue;
      const key = nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      if(!map[key]){
        map[key]={ nome_contato: nome, qtde: 0 };
      }
      map[key].qtde++;
    }

    EXPORT_ROWS = Object.values(map)
      .sort((a,b)=>b.qtde-a.qtde || a.nome_contato.localeCompare(b.nome_contato));

    setProgress(100, "Concluído", "");

    renderPreview();
    hide("step-fetching"); show("step-preview");
  }catch(ex){
    showError("Erro: "+ex.message);
    hide("step-fetching"); show("step-setup");
  }
}

function renderPreview(){
  const total = EXPORT_ROWS.length;
  const totalParcelas = EXPORT_ROWS.reduce((s,r)=>s+r.qtde, 0);
  const multi = EXPORT_ROWS.filter(r=>r.qtde>1).length;

  document.getElementById("preview-stats").innerHTML=`
    <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-label">Devedores únicos</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--muted)">${totalParcelas}</div><div class="stat-label">Total parcelas</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--accent)">${multi}</div><div class="stat-label">Com 2+ parcelas</div></div>`;

  document.getElementById("preview-tbody").innerHTML = EXPORT_ROWS.map((r,i)=>`
    <tr style="border-bottom:1px solid var(--border)">
      <td style="color:var(--faint)">${i+1}</td>
      <td style="color:var(--text);max-width:260px">${r.nome_contato}</td>
      <td style="color:var(--muted)">${primeiroNome(r.nome_contato)}</td>
      <td style="color:var(--faint)">—</td>
      <td>${r.qtde>1
        ? `<span class="badge">${r.qtde}</span>`
        : `<span style="color:var(--muted)">${r.qtde}</span>`}
      </td>
    </tr>`).join("");
}

function exportXLSX(){
  const rows = EXPORT_ROWS.map(r=>({
    nome_contato: r.nome_contato,
    telefone: "",
    primeiro_nome: primeiroNome(r.nome_contato),
    qtde_parcelas: r.qtde,
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  // largura das colunas
  ws["!cols"]=[{wch:40},{wch:16},{wch:20},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Vozis");
  const date = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `vozis_${TIER.toLowerCase()}_${date}.xlsx`);
}

function reset(){
  TIER=""; EXPORT_ROWS=[];
  clearError();
  hide("step-preview");
  document.querySelectorAll(".tier-btn").forEach(b=>b.classList.remove("active"));
  hide("btn-fetch");
  document.getElementById("preview-tbody").innerHTML="";
  document.getElementById("preview-stats").innerHTML="";
  show("step-setup");
}
</script>
</body>
</html>
